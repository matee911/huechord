name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
[redacted]
    # Note this does NOT guard against a new collaborator: their branch is
    # in-repo, so it passes and runs. Only the visibility change is covered.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
        with:
          # The runner is not ephemeral, so the default would leave the job
[redacted]
          # here pushes.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install webview-ui dependencies
        run: yarn install --frozen-lockfile
        working-directory: webview-ui

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test
