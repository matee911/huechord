name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job pushes, so the token has no reason to sit in
          # .git/config where a later step could pick it up.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Pinned to the active LTS line rather than whatever is newest, so a
          # Node release cannot turn a green branch red on its own.
          node-version: 24
          cache: yarn

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install webview-ui dependencies
        run: yarn install --frozen-lockfile
        working-directory: webview-ui

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      # Kept as separate steps rather than a single `yarn verify` so a failure
      # names itself in the job list. ci-workflow.test.ts holds the two in sync.
      - name: Build
        run: yarn build
